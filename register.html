<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ShopEase - Create Account</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(135deg,#0B4F6C,#146C94,#E8F4F8);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
}

.shopease-logo{
    margin-top:35px;
    font-size:42px;
    font-weight:bold;
    color:#ffffff;
    letter-spacing:2px;
    text-shadow:2px 2px 8px rgba(0,0,0,0.3);
}

.shopease-logo::after{
    content:"";
    display:block;
    width:90px;
    height:5px;
    background:#FF9800;
    margin:10px auto 0;
    border-radius:20px;
}

.login-box{
    width:430px;
    background:#ffffff;
    margin:35px auto;
    padding:35px;
    border-radius:15px;
    box-shadow:0 15px 35px rgba(0,0,0,0.25);
}

.login-box h1{
    text-align:center;
    color:#0B4F6C;
    font-size:30px;
    margin-bottom:25px;
}

.login-box label{
    display:block;
    margin-bottom:8px;
    color:#333;
    font-size:15px;
    font-weight:bold;
}

.login-box input{
    width:100%;
    height:48px;
    margin-bottom:18px;
    padding:0 15px;
    border:2px solid #d9d9d9;
    border-radius:10px;
    font-size:15px;
    transition:.3s;
}

.login-box input:focus{
    outline:none;
    border-color:#146C94;
    box-shadow:0 0 8px rgba(20,108,148,.35);
}

.login-box button{
    width:100%;
    height:50px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    background:#FF9800;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.login-box button:hover{
    background:#e68900;
    transform:translateY(-2px);
}

.terms{
    margin-top:20px;
    text-align:center;
    font-size:13px;
    color:#555;
    line-height:22px;
}

.login-box p{
    text-align:center;
    margin-top:22px;
    font-size:14px;
    color:#444;
}

.login-box a{
    color:#0B4F6C;
    font-weight:bold;
    text-decoration:none;
}

.login-box a:hover{
    color:#FF9800;
    text-decoration:underline;
}

footer{
    margin-top:auto;
    width:100%;
    text-align:center;
    padding:25px;
    color:white;
    font-size:14px;
}

footer div{
    margin-bottom:10px;
}

footer p{
    color:#e8e8e8;
    font-size:13px;
}

@media(max-width:600px){

    .login-box{
        width:92%;
        padding:25px;
    }

    .shopease-logo{
        font-size:34px;
    }

}

</style>

</head>

<body>

<div class="shopease-logo">

    Shop<span>Ease</span>

</div>

<div class="login-box">

<h1>Create Account</h1>

<form onsubmit="register(event)">

<label>Your Name</label>

<input
type="text"
id="name"
placeholder="Enter your name"
required>

<label>Email Address</label>

<input
type="email"
id="email"
placeholder="Enter your email"
required>

<label>Phone Number</label>

<input
type="tel"
id="phone"
placeholder="Enter 10-digit phone number"
maxlength="10"
pattern="[0-9]{10}"
inputmode="numeric"
oninput="this.value=this.value.replace(/[^0-9]/g,'')"
required>

<label>Password</label>

<input
type="password"
id="password"
placeholder="Create password"
required>

<label>Confirm Password</label>

<input
type="password"
id="confirmPassword"
placeholder="Re-enter password"
required>

<button type="submit">

Create Your ShopEase Account

</button>

</form>

<p class="terms">

By creating an account, you agree to ShopEase's Terms of Service and Privacy Policy.

</p>

<p>

Already have an account?

<a href="login.html">

Sign In

</a>

</p>

</div>

<footer>

<div>

Terms of Service &nbsp;&nbsp;
Privacy Policy &nbsp;&nbsp;
Help Center

</div>

<p>

© 2026 ShopEase. All Rights Reserved.

</p>

</footer>

<script>

function register(event){

event.preventDefault();

let name=document.getElementById("name").value;

let email=document.getElementById("email").value;

let phone=document.getElementById("phone").value;

let password=document.getElementById("password").value;

let confirmPassword=document.getElementById("confirmPassword").value;

if(phone.length!==10){

alert("Phone number must contain exactly 10 digits.");

return;

}

if(password!==confirmPassword){

alert("Passwords do not match.");

return;

}

localStorage.setItem("username",name);

localStorage.setItem("email",email);

localStorage.setItem("phone",phone);

localStorage.setItem("password",password);

alert("🎉 ShopEase Account Created Successfully!");

window.location.href="login.html";

}

</script>

</body>

</html>

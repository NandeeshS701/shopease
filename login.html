<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ShopEase - Sign In</title>

<style>
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:linear-gradient(135deg,#0B4F6C,#146C94,#E8F4F8);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
}

.shopease-logo{
    margin-top:35px;
    font-size:42px;
    font-weight:bold;
    color:#ffffff;
    letter-spacing:2px;
    text-shadow:2px 2px 8px rgba(0,0,0,0.3);
}

.shopease-logo::after{
    content:"";
    display:block;
    width:90px;
    height:5px;
    background:#FF9800;
    margin:10px auto 0;
    border-radius:20px;
}

.login-box{
    width:390px;
    margin:35px auto;
    background:#ffffff;
    border-radius:15px;
    padding:35px;
    box-shadow:0 15px 35px rgba(0,0,0,0.25);
}

.login-box h1{
    text-align:center;
    color:#0B4F6C;
    font-size:32px;
    margin-bottom:30px;
}

.login-box label{
    display:block;
    margin-bottom:8px;
    color:#333;
    font-size:15px;
    font-weight:bold;
}

.login-box input{
    width:100%;
    height:48px;
    margin-bottom:20px;
    padding:0 15px;
    border:2px solid #d9d9d9;
    border-radius:10px;
    font-size:15px;
    transition:0.3s;
}

.login-box input:focus{
    outline:none;
    border-color:#146C94;
    box-shadow:0 0 8px rgba(20,108,148,.35);
}

.login-box button{
    width:100%;
    height:48px;
    border:none;
    border-radius:10px;
    background:#FF9800;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.login-box button:hover{
    background:#e68900;
    transform:translateY(-2px);
}

.terms{
    margin-top:22px;
    font-size:13px;
    line-height:22px;
    color:#555;
    text-align:center;
}

.divider{
    display:flex;
    align-items:center;
    gap:10px;
    margin:28px 0;
    color:#777;
    font-size:14px;
}

.divider::before,
.divider::after{
    content:"";
    flex:1;
    height:1px;
    background:#ddd;
}

.create-btn{
    display:block;
    width:100%;
    text-align:center;
    text-decoration:none;
    background:#0B4F6C;
    color:white;
    padding:13px;
    border-radius:10px;
    font-weight:bold;
    transition:.3s;
}

.create-btn:hover{
    background:#146C94;
}

footer{
    margin-top:auto;
    width:100%;
    text-align:center;
    padding:25px;
    color:white;
    font-size:14px;
}

footer div{
    margin-bottom:10px;
}

footer p{
    font-size:13px;
    color:#e6e6e6;
}

@media(max-width:500px){

    .login-box{
        width:92%;
        padding:25px;
    }

    .shopease-logo{
        font-size:34px;
    }

}
</style>

</head>

<body>

<div class="shopease-logo">

    Shop<span>Ease</span>

</div>

<div class="login-box">

<h1>Sign In</h1>

<form onsubmit="login(event)">

<label>Email Address</label>

<input
type="email"
id="loginEmail"
placeholder="Enter your email"
required>

<label>Password</label>

<input
type="password"
id="loginPassword"
placeholder="Enter your password"
required>

<button type="submit">

Sign In

</button>

</form>

<p class="terms">

By continuing, you agree to ShopEase's Terms of Service and Privacy Policy.

</p>

<div class="divider">

New to ShopEase?

</div>

<a href="register.html" class="create-btn">

Create your ShopEase Account

</a>

</div>

<footer>

<div>

Terms of Service &nbsp;&nbsp;
Privacy Policy &nbsp;&nbsp;
Help Center

</div>

<p>

© 2026 ShopEase. All Rights Reserved.

</p>

</footer>

<script>

function login(event){

event.preventDefault();

let email=document.getElementById("loginEmail").value;

let password=document.getElementById("loginPassword").value;

let savedEmail=localStorage.getItem("email");

let savedPassword=localStorage.getItem("password");

if(email===savedEmail && password===savedPassword){

localStorage.setItem("loggedIn","true");

alert("Login Successful!");

window.location.href="index.html";

}

else{

alert("Invalid Email or Password");

}

}

</script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ShopEase - Sign In</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f3f6fb;
}

/* Logo */

.shopease-logo{

    text-align:center;
    font-size:45px;
    font-weight:bold;
    color:#0B4F6C;
    margin-top:35px;

}

.shopease-logo span{

    color:#FF9800;

}

.shopease-logo::after{

    content:"";
    display:block;
    width:120px;
    height:4px;
    background:#FF9800;
    margin:10px auto;
    border-radius:10px;

}

/* Login Box */

.login-box{

    width:360px;
    margin:35px auto;
    background:white;
    border:1px solid #ddd;
    border-radius:10px;
    padding:30px;
    box-shadow:0 8px 18px rgba(0,0,0,0.15);

}

.login-box h1{

    font-size:30px;
    margin-bottom:25px;
    color:#0B4F6C;

}

.login-box label{

    font-size:14px;
    font-weight:bold;

}

.login-box input{

    width:100%;
    height:42px;
    margin:8px 0 18px;
    padding:10px;
    border:1px solid #aaa;
    border-radius:6px;
    font-size:15px;

}

.login-box input:focus{

    outline:none;
    border:2px solid #FF9800;

}

.login-box button{

    width:100%;
    height:45px;
    border:none;
    border-radius:25px;
    background:#FF9800;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;

}

.login-box button:hover{

    background:#e68900;

}

.terms{

    font-size:12px;
    color:#555;
    line-height:18px;
    margin-top:22px;

}

.divider{

    display:flex;
    align-items:center;
    gap:10px;
    margin:28px 0;
    color:#777;
    font-size:13px;

}

.divider::before,
.divider::after{

    content:"";
    flex:1;
    height:1px;
    background:#ddd;

}

.create-btn{

    display:block;
    text-align:center;
    text-decoration:none;
    color:#0B4F6C;
    border:1px solid #0B4F6C;
    padding:12px;
    border-radius:6px;
    font-weight:bold;
    transition:.3s;

}

.create-btn:hover{

    background:#0B4F6C;
    color:white;

}

/* Footer */

footer{

    margin-top:60px;
    text-align:center;
    color:#666;
    font-size:13px;

}

footer div{

    color:#0B4F6C;
    margin-bottom:15px;

}

footer p{

    margin-top:10px;

}

</style>

</head>

<body>

<div class="shopease-logo">

    Shop<span>Ease</span>

</div>

<div class="login-box">

<h1>Sign In</h1>

<form onsubmit="login(event)">

<label>Email Address</label>

<input
type="email"
id="loginEmail"
placeholder="Enter your email"
required>

<label>Password</label>

<input
type="password"
id="loginPassword"
placeholder="Enter your password"
required>

<button type="submit">

Sign In

</button>

</form>

<p class="terms">

By continuing, you agree to ShopEase's Terms of Service and Privacy Policy.

</p>

<div class="divider">

New to ShopEase?

</div>

<a href="register.html" class="create-btn">

Create your ShopEase Account

</a>

</div>

<footer>

<div>

Terms of Service &nbsp;&nbsp;
Privacy Policy &nbsp;&nbsp;
Help Center

</div>

<p>

© 2026 ShopEase. All Rights Reserved.

</p>

</footer>

<script>

function login(event){

event.preventDefault();

let email=document.getElementById("loginEmail").value;

let password=document.getElementById("loginPassword").value;

let savedEmail=localStorage.getItem("email");

let savedPassword=localStorage.getItem("password");

if(email===savedEmail && password===savedPassword){

localStorage.setItem("loggedIn","true");

alert("Login Successful!");

window.location.href="index.html";

}

else{

alert("Invalid Email or Password");

}

}

</script>

</body>

</html>

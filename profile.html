<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile | ShopEase</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    

</head>

<body>

<div class="header">

    ShopEase

</div>

<div class="profile-box">

    <div class="profile">

        <div class="profile-avatar" id="avatar">

            U

        </div>

        <h2 id="profileName">

            My Profile

        </h2>

        <p id="profileEmail">

            user@email.com

        </p>

    </div>

    <div class="details">

        <p>

            <i class="fa-solid fa-user"></i>

            <b>Name :</b>

            <span id="name"></span>

        </p>

        <p>

            <i class="fa-solid fa-envelope"></i>

            <b>Email :</b>

            <span id="email"></span>

        </p>

        <p>

            <i class="fa-solid fa-phone"></i>

            <b>Phone :</b>

            <span id="phone"></span>

        </p>

        <p>

            <i class="fa-solid fa-circle-check"></i>

            <b>Status :</b>

            <span class="status">

                Logged In

            </span>

        </p>

    </div>

    <button class="home-btn" onclick="goHome()">

        🏠 Back to Home

    </button>

    <button class="logout-btn" onclick="logout()">

        🚪 Logout

    </button>
    <script>

window.onload = function(){

    if(localStorage.getItem("loggedIn")!="true"){

        alert("Please Login First");

        window.location.href="login.html";

        return;

    }

    let username = localStorage.getItem("username") || "User";

    let email = localStorage.getItem("email") || "Not Available";

    let phone = localStorage.getItem("phone") || "Not Available";

    document.getElementById("name").innerHTML = username;

    document.getElementById("email").innerHTML = email;

    document.getElementById("phone").innerHTML = phone;

    document.getElementById("profileName").innerHTML = username;

    document.getElementById("profileEmail").innerHTML = email;

    document.getElementById("avatar").innerHTML = username.charAt(0).toUpperCase();

}

function goHome(){

    window.location.href="index.html";

}

function logout(){

    localStorage.removeItem("loggedIn");

    alert("Logged Out Successfully");

    window.location.href="login.html";

}

</script>

</body>
<style>
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{

    min-height:100vh;
    background:linear-gradient(135deg,#667eea,#764ba2);
    display:flex;
    justify-content:center;
    align-items:center;

}


.header{

    position:fixed;
    top:0;
    left:0;
    width:100%;
    padding:20px;
    text-align:center;

    background:#111;
    color:white;
    font-size:28px;
    font-weight:bold;

    letter-spacing:1px;

    box-shadow:0 5px 15px rgba(0,0,0,0.3);

}


.profile-box{

    width:420px;

    background:white;

    margin-top:80px;

    padding:30px;

    border-radius:20px;

    box-shadow:0 15px 30px rgba(0,0,0,0.25);

    text-align:center;

    animation:show 0.5s ease;

}


@keyframes show{

    from{

        opacity:0;
        transform:translateY(40px);

    }

    to{

        opacity:1;
        transform:translateY(0);

    }

}



.profile-avatar{

    width:100px;
    height:100px;

    border-radius:50%;

    background:linear-gradient(135deg,#ff9800,#ff5722);

    color:white;

    font-size:45px;

    font-weight:bold;

    display:flex;

    justify-content:center;

    align-items:center;

    margin:auto;

    box-shadow:0 8px 15px rgba(0,0,0,0.2);

}


.profile h2{

    margin-top:20px;

    color:#333;

    font-size:26px;

}


.profile p{

    margin-top:8px;

    color:#777;

    font-size:16px;

}


.details{

    margin-top:30px;

    text-align:left;

    background:#f5f5f5;

    padding:20px;

    border-radius:15px;

}


.details p{

    padding:12px 0;

    font-size:16px;

    color:#444;

    border-bottom:1px solid #ddd;

}


.details p:last-child{

    border:none;

}



.details i{

    width:30px;

    color:#764ba2;

    font-size:18px;

}



.status{

    color:green;

    font-weight:bold;

}



button{

    width:100%;

    padding:14px;

    margin-top:20px;

    border:none;

    border-radius:10px;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    transition:0.3s;

}



.home-btn{

    background:#ff9800;

    color:white;

}


.home-btn:hover{

    background:#e68900;

    transform:scale(1.03);

}



.logout-btn{

    background:#e53935;

    color:white;

}



.logout-btn:hover{

    background:#c62828;

    transform:scale(1.03);

}



@media(max-width:500px){

    .profile-box{

        width:90%;

    }

}
</style>

</html>

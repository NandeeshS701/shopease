<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile | ShopEase</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="header">

    ShopEase

</div>

<div class="profile-box">

    <div class="profile">

        <div class="profile-avatar" id="avatar">

            U

        </div>

        <h2 id="profileName">

            My Profile

        </h2>

        <p id="profileEmail">

            user@email.com

        </p>

    </div>

    <div class="details">

        <p>

            <i class="fa-solid fa-user"></i>

            <b>Name :</b>

            <span id="name"></span>

        </p>

        <p>

            <i class="fa-solid fa-envelope"></i>

            <b>Email :</b>

            <span id="email"></span>

        </p>

        <p>

            <i class="fa-solid fa-phone"></i>

            <b>Phone :</b>

            <span id="phone"></span>

        </p>

        <p>

            <i class="fa-solid fa-circle-check"></i>

            <b>Status :</b>

            <span class="status">

                Logged In

            </span>

        </p>

    </div>

    <button class="home-btn" onclick="goHome()">

        🏠 Back to Home

    </button>

    <button class="logout-btn" onclick="logout()">

        🚪 Logout

    </button>
    <script>

window.onload = function(){

    if(localStorage.getItem("loggedIn")!="true"){

        alert("Please Login First");

        window.location.href="login.html";

        return;

    }

    let username = localStorage.getItem("username") || "User";

    let email = localStorage.getItem("email") || "Not Available";

    let phone = localStorage.getItem("phone") || "Not Available";

    document.getElementById("name").innerHTML = username;

    document.getElementById("email").innerHTML = email;

    document.getElementById("phone").innerHTML = phone;

    document.getElementById("profileName").innerHTML = username;

    document.getElementById("profileEmail").innerHTML = email;

    document.getElementById("avatar").innerHTML = username.charAt(0).toUpperCase();

}

function goHome(){

    window.location.href="index.html";

}

function logout(){

    localStorage.removeItem("loggedIn");

    alert("Logged Out Successfully");

    window.location.href="login.html";

}

</script>

</body>

</html>

</div>

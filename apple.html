        <style>
        *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#eef5f9;
    color:#333;
}

/* ===========================
        TOP BAR
=========================== */

.top-bar{
    background:#06293D;
    display:flex;
    justify-content:flex-end;
    align-items:center;
    gap:15px;
    padding:10px 40px;
}

.login-btn,
.register-btn,
.logout-btn{
    text-decoration:none;
    background:#FF9800;
    color:#fff;
    padding:8px 18px;
    border-radius:6px;
    font-weight:bold;
    transition:.3s;
    border:none;
    cursor:pointer;
}

.login-btn:hover,
.register-btn:hover,
.logout-btn:hover{
    background:#e68900;
}

/* ===========================
        NAVBAR
=========================== */

.navbar{
    height:70px;
    background:#0B4F6C;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 40px;
    color:white;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
}

.logo{
    font-size:32px;
    font-weight:bold;
    color:#FFD166;
    letter-spacing:1px;
}

.logo span{
    color:#ffffff;
}

.nav-links{
    display:flex;
    align-items:center;
    gap:30px;
}

.nav-links a{
    color:white;
    text-decoration:none;
    font-size:17px;
    font-weight:bold;
    transition:.3s;
}

.nav-links a:hover{
    color:#FFD166;
}

.cart-icon{
    font-size:28px;
    cursor:pointer;
    color:#FFD166;
}

/* ===========================
        PAGE TITLE
=========================== */

.page-title{
    width:100%;
    padding:45px 20px;
    text-align:center;
    background:linear-gradient(135deg,#0B4F6C,#146C94);
    color:white;
}

.page-title h1{
    font-size:42px;
    margin-bottom:10px;
}

.page-title p{
    font-size:18px;
    opacity:.9;
}

/* ===========================
      PRODUCTS SECTION
=========================== */

.products{
    width:95%;
    max-width:1400px;
    margin:40px auto;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:30px;
}
        /* ===========================
        PRODUCT CARD
=========================== */

.product-card{
    background:#fff;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 6px 18px rgba(0,0,0,.15);
    transition:.35s;
    display:flex;
    flex-direction:column;
}

.product-card:hover{
    transform:translateY(-10px);
    box-shadow:0 12px 30px rgba(0,0,0,.25);
}

.product-image{
    width:100%;
    height:260px;
    overflow:hidden;
    background:#f8f8f8;
}

.product-image img{
    width:100%;
    height:100%;
    object-fit:contain;
    transition:.4s;
    padding:15px;
}

.product-card:hover .product-image img{
    transform:scale(1.08);
}

.product-info{
    padding:20px;
}

.product-info h2{
    color:#0B4F6C;
    font-size:22px;
    margin-bottom:12px;
}

.product-description{
    color:#666;
    font-size:15px;
    line-height:24px;
    margin-bottom:15px;
}

.price{
    font-size:28px;
    color:#E53935;
    font-weight:bold;
    margin-bottom:12px;
}

.old-price{
    color:#888;
    font-size:17px;
    text-decoration:line-through;
    margin-left:10px;
}

.rating{
    color:#ffb400;
    font-size:18px;
    margin-bottom:18px;
}

.stock{
    color:green;
    font-weight:bold;
    margin-bottom:18px;
}

.product-buttons{
    display:flex;
    gap:10px;
}

.product-buttons button{
    flex:1;
    height:45px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
    transition:.3s;
}

.buy-btn{
    background:#0B4F6C;
    color:white;
}

.buy-btn:hover{
    background:#083344;
}

.cart-btn{
    background:#FF9800;
    color:white;
}

.cart-btn:hover{
    background:#e68900;
}
        /* ===========================
        SEARCH BAR
=========================== */

.search-section{
    width:90%;
    max-width:900px;
    margin:30px auto;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
}

.search-section input{
    width:100%;
    height:50px;
    padding:0 15px;
    border:2px solid #0B4F6C;
    border-radius:8px;
    outline:none;
    font-size:16px;
}

.search-section button{
    width:140px;
    height:50px;
    border:none;
    border-radius:8px;
    background:#FF9800;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.search-section button:hover{
    background:#e68900;
}

/* ===========================
      BACK TO HOME BUTTON
=========================== */

.back-home{
    display:inline-block;
    margin:30px;
    padding:12px 22px;
    background:#0B4F6C;
    color:white;
    text-decoration:none;
    font-size:17px;
    font-weight:bold;
    border-radius:8px;
    transition:.3s;
}

.back-home:hover{
    background:#083344;
    transform:translateY(-3px);
}

/* ===========================
          FOOTER
=========================== */

footer{
    margin-top:60px;
}

.footer-top{
    background:#0B4F6C;
    color:white;
    text-align:center;
    padding:18px;
    font-size:18px;
    font-weight:bold;
}

.footer-main{
    background:#083344;
    color:white;
    display:flex;
    justify-content:space-evenly;
    flex-wrap:wrap;
    padding:45px 20px;
}

.footer-column{
    min-width:220px;
    margin:15px;
}

.footer-column h3{
    margin-bottom:15px;
    color:#FFD166;
}

.footer-column a{
    display:block;
    color:#ddd;
    text-decoration:none;
    margin:10px 0;
    transition:.3s;
}

.footer-column a:hover{
    color:#FFD166;
}

.footer-bottom{
    background:#06293D;
    color:white;
    text-align:center;
    padding:18px;
    font-size:15px;
}

/* ===========================
        ANIMATIONS
=========================== */

.product-card{
    animation:fadeUp .6s ease;
}

@keyframes fadeUp{

    from{
        opacity:0;
        transform:translateY(30px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

/* ===========================
      SCROLL BAR
=========================== */

::-webkit-scrollbar{
    width:10px;
}

::-webkit-scrollbar-track{
    background:#f1f1f1;
}

::-webkit-scrollbar-thumb{
    background:#0B4F6C;
    border-radius:20px;
}

::-webkit-scrollbar-thumb:hover{
    background:#083344;
}
        /*==========================
      RESPONSIVE DESIGN
==========================*/

@media(max-width:1200px){

    .products{
        grid-template-columns:repeat(3,1fr);
    }

}

@media(max-width:900px){

    .navbar{
        flex-direction:column;
        height:auto;
        padding:15px;
        gap:15px;
    }

    .nav-links{
        flex-wrap:wrap;
        justify-content:center;
        gap:18px;
    }

    .page-title h1{
        font-size:34px;
    }

    .products{
        grid-template-columns:repeat(2,1fr);
        gap:25px;
    }

    .footer-main{
        justify-content:center;
        text-align:center;
    }

}

@media(max-width:600px){

    .top-bar{
        justify-content:center;
        flex-wrap:wrap;
        padding:10px;
    }

    .logo{
        font-size:26px;
    }

    .page-title{
        padding:30px 15px;
    }

    .page-title h1{
        font-size:28px;
    }

    .page-title p{
        font-size:15px;
    }

    .search-section{
        flex-direction:column;
    }

    .search-section button{
        width:100%;
    }

    .products{
        grid-template-columns:1fr;
    }

    .product-card{
        width:100%;
    }

    .product-image{
        height:240px;
    }

    .product-buttons{
        flex-direction:column;
    }

    .footer-column{
        width:100%;
        text-align:center;
    }

    .back-home{
        display:block;
        width:90%;
        margin:20px auto;
        text-align:center;
    }

}

/*==========================
      EXTRA EFFECTS
==========================*/

.product-card{
    overflow:hidden;
}

.product-card::before{

    content:"";
    position:absolute;
    width:100%;
    height:5px;
    background:#FF9800;
    left:0;
    top:0;

}

.product-card{
    position:relative;
}

.product-card:hover::before{

    background:#0B4F6C;

}

.product-info h2{

    transition:.3s;

}

.product-card:hover .product-info h2{

    color:#FF9800;

}

.buy-btn,
.cart-btn{

    transition:.3s;

}

.buy-btn:hover,
.cart-btn:hover{

    transform:scale(1.05);

}

img{

    max-width:100%;

}

html{

    scroll-behavior:smooth;

}
    </style>
</html>

<style>


*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}


body{

    background:#eef5f9;

}


/* NAVBAR */

.navbar{

    background:#0B4F6C;

    min-height:80px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:0 50px;

    box-shadow:0 4px 12px rgba(0,0,0,.2);

}


.logo{

    font-size:30px;

    font-weight:bold;

    color:#FFD166;

    white-space:nowrap;

}



.home-btn{

    text-decoration:none;

    color:white;

    background:#FF9800;

    padding:12px 22px;

    border-radius:8px;

    font-weight:bold;

}



.home-btn:hover{

    background:#e68900;

}



/* TITLE */


.title{

    text-align:center;

    margin:35px 0;

    color:#0B4F6C;

    font-size:40px;

}





/* PRODUCT GRID */


.products{

    width:95%;

    max-width:1400px;

    margin:auto;

    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:30px;

    padding-bottom:40px;

}





.product{


    background:white;

    border-radius:15px;

    padding:20px;

    height:500px;

    text-align:center;

    display:flex;

    flex-direction:column;

    justify-content:space-between;

    box-shadow:0 5px 15px rgba(0,0,0,.15);

    transition:.3s;

}




.product:hover{

    transform:translateY(-8px);

}





.product img{

    width:220px;

    height:220px;

    object-fit:contain;

    margin:auto;

}





.product h3{

    color:#0B4F6C;

    font-size:22px;

}





.product h2{

    color:#E53935;

    font-size:28px;

}





.product p{

    color:#FF9800;

    font-size:18px;

}





.product button{

    width:100%;

    height:45px;

    border:none;

    border-radius:8px;

    background:#FF9800;

    color:white;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

}




.product button:hover{

    background:#e68900;

}





@media(max-width:1200px){

.products{

grid-template-columns:repeat(3,1fr);

}

}



@media(max-width:900px){

.products{

grid-template-columns:repeat(2,1fr);

}


.navbar{

flex-direction:column;

gap:20px;

padding:20px;

}

}



@media(max-width:600px){

.products{

grid-template-columns:1fr;

}


.logo{

font-size:25px;

}


.title{

font-size:30px;

}

}



</style>


</head>

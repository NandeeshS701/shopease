<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Apple Store</title>

<script src="script.js" defer></script>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#eef5f9;
}


.navbar{

    background:#0B4F6C;
    height:70px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 40px;
    color:white;

}


.logo{

    font-size:32px;
    font-weight:bold;
    color:#FFD166;

}


.home-btn{

    text-decoration:none;
    color:white;
    background:#FF9800;
    padding:12px 20px;
    border-radius:8px;
    font-weight:bold;

}


.home-btn:hover{

    background:#e68900;

}



.title{

    text-align:center;
    margin:35px 0;
    color:#0B4F6C;
    font-size:40px;

}




.products{

    width:95%;
    max-width:1400px;
    margin:auto;

    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:30px;

}



.product{


    background:white;

    border-radius:15px;

    padding:20px;

    text-align:center;

    box-shadow:0 5px 15px rgba(0,0,0,.15);

    height:500px;

    display:flex;

    flex-direction:column;

    justify-content:space-between;

}



.product:hover{

    transform:translateY(-8px);

}



.product img{


    width:220px;

    height:220px;

    object-fit:contain;

    margin:auto;

}



.product h3{

    color:#0B4F6C;

    font-size:22px;

}



.product h2{

    color:#E53935;

    font-size:28px;

}



.product p{

    color:#FF9800;

}



.product button{


    width:100%;

    height:45px;

    background:#FF9800;

    border:none;

    border-radius:8px;

    color:white;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

}



.product button:hover{

    background:#e68900;

}



@media(max-width:1200px){

.products{

grid-template-columns:repeat(3,1fr);

}

}


@media(max-width:900px){

.products{

grid-template-columns:repeat(2,1fr);

}

}


@media(max-width:600px){

.products{

grid-template-columns:1fr;

}

.navbar{

flex-direction:column;

height:auto;

padding:20px;

gap:15px;

}

}


</style>


</head>



<body>
